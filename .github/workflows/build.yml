name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemShtepenko/buildozer-action@v1.2.0
        id: buildozer
        with:
          command: buildozer android debug
          submodule_parent_repo_path: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-kivy-app
          path: bin/*.apk
          
